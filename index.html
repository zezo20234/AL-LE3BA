<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>Al-Le3ba · Season 1</title>
<style>
:root{--r:#ff4757;--rd:#c4202e;--g:#2ecc71;--gd:#1a9a4f;--bg:#080506;--tx:#f6eeee;--mu:#b58a8e;--ln:#4a2a2e}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:radial-gradient(circle at 50% 0,#2e0c12,var(--bg) 62%);color:var(--tx);font-family:Georgia,serif;min-height:100vh;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
#ld{position:fixed;inset:0;background:radial-gradient(ellipse at 50% 38%,#3a0c14 0,#12060a 45%,#000 80%);z-index:9;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;transition:opacity .8s;overflow:hidden}
#ld svg{width:min(78vw,330px);overflow:visible;position:relative;z-index:2}
.rays{transform-box:fill-box;transform-origin:center;animation:spin 24s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.sun{transform-box:fill-box;transform-origin:center;animation:sunup 1.6s cubic-bezier(.2,.8,.3,1) both,pulse 2.2s 1.6s ease-in-out infinite alternate}
@keyframes sunup{from{transform:translateY(60px) scale(.4);opacity:0}}
@keyframes pulse{to{transform:scale(1.08)}}
.st{opacity:0;animation:drop .55s cubic-bezier(.3,1.4,.5,1) forwards}
@keyframes drop{from{opacity:0;transform:translateY(-46px)}to{opacity:1;transform:none}}
.cap{opacity:0;animation:drop .5s cubic-bezier(.3,1.4,.5,1) 1.95s forwards,flash 1.2s 2.4s ease-out both}
@keyframes flash{0%{filter:brightness(3) drop-shadow(0 0 14px #ffd0d4)}100%{filter:none}}
.beam{transform-box:fill-box;transform-origin:50% 100%;opacity:0;animation:beam 1s 2.4s ease-out forwards}
@keyframes beam{from{opacity:0;transform:scaleY(.1)}to{opacity:.85;transform:none}}
.glow{opacity:0;animation:fade 1.2s 2.2s forwards}@keyframes fade{to{opacity:1}}
.tw{animation:tw 1.6s infinite alternate}.tw:nth-child(2n){animation-delay:.5s}.tw:nth-child(3n){animation-delay:1s}
@keyframes tw{from{opacity:.15}to{opacity:1}}
.sp{position:absolute;bottom:-10px;width:3px;height:3px;border-radius:50%;background:#ff6b78;opacity:0;animation:rise linear infinite}
.sp:nth-child(2n){background:#4be68a}
@keyframes rise{0%{opacity:0;transform:translateY(0)}15%{opacity:.8}100%{opacity:0;transform:translateY(-105vh) translateX(var(--dx))}}
#ld h1{background:linear-gradient(100deg,#2ecc71 20%,#ffd6d9 50%,#ff4757 80%) 0 0/250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shim 2.4s linear infinite,tin 1s 1.2s both;opacity:0}
@keyframes shim{to{background-position:-250% 0}}@keyframes tin{from{opacity:0;letter-spacing:22px}to{opacity:1;letter-spacing:6px}}
@media (prefers-reduced-motion:reduce){.rays,.sp,.tw,.sun{animation:none}}
.gl{letter-spacing:14px;font-size:22px;color:#3a1218}.gl i{font-style:normal;animation:li .5s forwards}
@keyframes li{to{color:var(--r);text-shadow:0 0 10px var(--r)}}.gl i:nth-child(2n){--x:1}
.bar{width:200px;height:4px;background:#2a1014;border-radius:4px;overflow:hidden}.bar b{display:block;height:100%;background:linear-gradient(90deg,var(--g),var(--r));animation:fill 3.4s cubic-bezier(.4,0,.2,1) forwards}
@keyframes fill{from{width:0}to{width:100%}}
#ld h1{margin:0;font-size:32px;letter-spacing:6px;text-indent:6px}#ld small{color:#c08a90;letter-spacing:3px}
header{display:flex;align-items:center;justify-content:space-between;padding:8px 12px}
header h3{margin:0;background:linear-gradient(90deg,var(--g),var(--r));-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:3px;font-size:16px}
.rf{background:none;border:1px solid var(--ln);color:var(--r);border-radius:50%;width:26px;height:26px;font-size:14px;padding:0}
.dot{width:9px;height:9px;border-radius:50%;background:var(--r);display:inline-block}.dot.on{background:var(--g)}
#app{max-width:480px;margin:auto;padding:8px 16px 40px}
.card{border:2px solid var(--r);border-radius:16px;padding:16px;margin:12px 0;background:#150a0dcc;box-shadow:0 0 22px #ff475722}
.card h2{margin:6px 0;color:#fff}.card p{margin:4px 0;line-height:1.5}
.b{display:block;width:100%;background:linear-gradient(#ff5a67,var(--rd));color:#fff;border:0;border-radius:12px;padding:13px;font-size:17px;font-weight:bold;margin:8px 0;font-family:inherit}
.b.gr{background:linear-gradient(#3fe283,var(--gd));color:#04140a}
.b.s{display:inline-block;width:auto;padding:8px 12px;font-size:14px;margin:4px 4px 4px 0}
.b.d{background:#2a1518;color:#ff9aa2;border:1px solid var(--ln)}
.b.on{outline:3px solid #fff}
.sb{display:flex;gap:10px}.sb div{flex:1;text-align:center;border:2px solid var(--ln);border-radius:14px;padding:12px;background:#0f0709}
.sb big{display:block;font-size:34px}
.ok{text-align:center;padding:12px;border-radius:12px;background:#12351f;border:1px solid var(--gd);margin:8px 0}
input,textarea,select{width:100%;background:#0d0708;color:var(--tx);border:1px solid var(--ln);border-radius:10px;padding:10px;margin:4px 0;font:inherit;font-size:16px}
h4{color:var(--g);margin:16px 0 4px}small.c{color:var(--mu)}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:10px 0}
.tab{background:#1a0d10;color:var(--mu);border:1px solid var(--ln);border-radius:10px;padding:9px 2px;font-size:12px;font-family:inherit}
.tab.on{background:linear-gradient(#3fe283,var(--gd));color:#04140a;border-color:var(--g);font-weight:bold}
.nav{display:flex;gap:6px;align-items:center}.nav select{flex:1}.nav .b{width:48px;padding:10px 0;margin:4px 0}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between;border:1px solid var(--ln);background:#0f0709;border-radius:12px;padding:8px 10px;margin:6px 0}
.row .n{flex:1;font-size:14px}
.lvd{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.grid2 .b{margin:0}
.panel{border:1px solid var(--ln);background:#120a0c;border-radius:16px;padding:12px;margin:10px 0}
.big{font-size:44px;text-align:center;margin:0}
details summary{color:var(--g);padding:8px 0}
</style></head><body>

<h1>AL-LE3BA</h1><small>SEASON ONE</small><div class="gl" id="gl"></div><div class="bar"><b></b></div><small id="lt"></small></div>
<header><button class="rf" onclick="hard()" title="Update">↻</button><h3 id="ttl">AL-LE3BA</h3><span class="dot" id="dot"></span></header>
<div id="app"></div>
<script>
// === Paste your Firebase Realtime Database URL here (no trailing slash). Empty = no sync between phones.
const DB="";
const CV=2; // challenge list version: bump to push a new default list to every phone
const C=[
// EASY (days 1-10)
"Bed Boss|Make your bed neatly AND clear your desk in 5 minutes. Zezo inspects it.",
"Tongue Twister|Say 'She sells seashells by the seashore' 5 times fast with no mistakes.",
"Jumping Jacks|Do 25 jumping jacks without stopping.",
"Pharaoh Artist|Draw a pharaoh mask in 5 minutes. Make it colourful!",
"Kindness Quest|Do 2 kind things for your family today and tell Zezo what they were.",
"Flamingo Stand|Stand on one leg with your arms out: 30 seconds on each leg, no wobbling.",
"Water Warrior|Drink 4 cups of water today. Zezo counts.",
"Golden Story|Tell a 1-minute made-up story about a golden eye that must include a dragon.",
"Sock Basket|Stand 2 big steps away and toss rolled socks into a basket: score 5 out of 10.",
"Funny Reader|Read 2 pages out loud, using a different silly voice on every paragraph.",
// MEDIUM (days 11-20)
"Memory Cards|Look at 10 objects for 20 seconds, then name at least 9 of them.",
"Plank Time|Hold a plank for 45 seconds.",
"Riddle Duel|Solve 3 riddles from Zezo. One wrong answer and you fail.",
"Secret Code|Invent your own secret alphabet, write your name in it and teach Zezo to read it.",
"Silent Ninja|Stay completely silent for 2 minutes while Zezo tries to make you laugh.",
"Cup Pyramid|Build a 6-cup pyramid in under 90 seconds.",
"Math Sprint|Answer 12 math questions in 2 minutes.",
"Blind Find|Blindfolded, find 3 objects Zezo names in under 90 seconds.",
"Spelling Bee|Spell 10 words picked by Zezo, no mistakes allowed.",
"Chef Helper|Help an adult cook: set the table AND clear up after the meal.",
// HARD (days 21-30)
"Staring Contest|Beat Zezo in a no-blinking, no-smiling staring contest.",
"Memory Master|Memorize 15 objects in 30 seconds, then name at least 12.",
"Plank Boss|Hold a plank for 1 minute 15 seconds.",
"Code Breaker|Crack a 5-letter cipher that Zezo prepares, in under 5 minutes.",
"Speed Clean|Clean your whole room in 10 minutes and pass Zezo's inspection.",
"Twister Pro|Say 3 hard tongue twisters in a row with no mistakes.",
"Book Report|Tell Zezo the plot of a book in 2 minutes, then answer 2 questions about it.",
"Puzzle Run|Finish a 30-piece puzzle in under 10 minutes.",
"Mind Maze|Draw a maze that takes Zezo more than 1 minute to solve.",
"The Grand Finale|Three in a row with no break: 20 squats, one riddle, then a 30-second one-leg balance."
];
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),cap=s=>s[0].toUpperCase()+s.slice(1);
const td=()=>{let d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const PC={lilly:'#ff5a67',asser:'#2ecc71'};
let S=JSON.parse(localStorage.S||'null')||{start:td(),ch:[...C],cv:CV,win:{},claim:{},custom:{},bonus:{lilly:0,asser:0},pin:"1234"};
let Q=JSON.parse(localStorage.Q||'[]'),who=localStorage.who||'',zd=0,ok=0,cf=0,tab=localStorage.tab||'today',ei=-1;
const save=()=>localStorage.S=JSON.stringify(S);
function setp(p,v){let o=S,k=p.split('/');k.slice(0,-1).forEach(x=>o=o[x]=o[x]||{});o[k.at(-1)]=v;save();Q.push([p,v]);localStorage.Q=JSON.stringify(Q);flush();render()}
async function flush(){if(!DB)return;try{while(Q.length){let[p,v]=Q[0],r=await fetch(`${DB}/${p}.json`,{method:'PUT',body:JSON.stringify(v)});if(!r.ok)throw 0;Q.shift();localStorage.Q=JSON.stringify(Q)}}catch(e){}}
function mig(){if(S.cv===CV)return;S.ch=[...C];S.cv=CV;save();Q.push(['ch',S.ch],['cv',CV]);localStorage.Q=JSON.stringify(Q);flush()}
async function pull(){if(!DB)return;await flush();if(Q.length){ok=0;return dot()}
 try{let d=await(await fetch(DB+'/.json')).json();ok=1;if(d){S={...S,...d};S.ch=Object.values(S.ch||C);mig();save()}else await fetch(DB+'/.json',{method:'PUT',body:JSON.stringify(S)});
 if(!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName))render()}catch(e){ok=0}dot()}
const dot=()=>$('#dot').className='dot'+(ok?' on':'');
function dayN(){let n=new Date(Date.now()-(S.hour??4)*36e5),[y,m,d]=S.start.split('-').map(Number);return Math.floor((Date.UTC(n.getFullYear(),n.getMonth(),n.getDate())-Date.UTC(y,m-1,d))/864e5)+1}
const curDay=()=>Math.min(S.ch.length,Math.max(1,dayN()));
const lv=n=>n<=10?['Easy','#2ecc71']:n<=20?['Medium','#ff9f43']:['Hard','#ff4757'];
const ci=n=>{let p=(S.pick||{})['d'+n];return p!=null&&S.ch[p]?+p:n-1};
const chal=n=>{let[a,...r]=((S.custom&&S.custom['d'+n])||S.ch[ci(n)]||'?|').split('|');return[a,r.join('|')]};
const sc=p=>Object.values(S.win||{}).filter(w=>w==p).length*3+((S.bonus||{})[p]||0);
const sc0=p=>sc(p)-((S.bonus||{})[p]||0);
function pick(p){if(p=='zezo'&&prompt('Master PIN')!=S.pin)return alert('Wrong PIN');who=localStorage.who=p;render()}
async function hard(){try{await Promise.all((await navigator.serviceWorker.getRegistrations()).map(r=>r.unregister()));await Promise.all((await caches.keys()).map(k=>caches.delete(k)))}catch(e){}location.reload()}
function cd(){let t=new Date(),x=new Date(t);x.setHours(S.hour??4,0,0,0);if(x<=t)x.setDate(x.getDate()+1);let s=Math.floor((x-t)/1e3),e=$('#cd');if(e)e.textContent=`Next challenge in ${Math.floor(s/3600)}h ${Math.floor(s%3600/60)}m ${s%60}s`}
setInterval(cd,1000);
const go=k=>{zd=Math.min(S.ch.length,Math.max(1,(zd||curDay())+k));render()};
const setTab=k=>{tab=localStorage.tab=k;ei=-1;render()};
function bump(p,k){setp('bonus/'+p,((S.bonus||{})[p]||0)+k)}
function render(){const A=$('#app');
 if(!who){A.innerHTML='<h2 style="text-align:center;color:#ff6b78">Who are you?</h2>'+['lilly','asser','zezo'].map(p=>`<button class="b ${p=='asser'?'gr':''}" onclick="pick('${p}')">${p=='zezo'?'👑 Zezo (Master)':cap(p)}</button>`).join('')+'<small class=c>This phone will remember your choice.</small>';return}
 let T=S.ch.length,n=dayN(),cur=curDay(),m=who=='zezo',d=m?(zd||cur):cur,[t,ds]=chal(d),[ln,lc]=lv(ci(d)+1),w=(S.win||{})['d'+d],cl=(S.claim||{})['d'+d]||{};
 let h=`<small class=c>Playing as ${m?'👑 Zezo':cap(who)}</small>`;
 if(!m||tab=='today')h+=`<div class=card style="border-color:${lc};box-shadow:0 0 22px ${lc}33"><small style="color:${lc}">${ln.toUpperCase()} · DAY ${d}/${T}</small><h2>${esc(t)}</h2><p>${esc(ds)}</p></div>`;
 if(!m){
  if(n<1)h+=`<div class=ok>Season starts on ${S.start}</div>`;
  else if(n>T){let a=sc('lilly'),b=sc('asser');h+=`<div class=ok>🏆 Season complete! ${a==b?"It's a tie!":(a>b?'Lilly':'Asser')+' is the champion!'}</div>`}
  else{h+=w?`<div class=ok>${w=='none'?'No winner today':w==who?'🏆 You won! +3':"Zezo has picked today's winner"}</div>`:cl[who]?'<div class=ok>⏳ Sent! Waiting for Zezo to check…</div>':cf?`<div class=panel><b>Are you sure you did it?</b><p>Zezo will check your challenge.</p><div class=grid2><button class="b gr" onclick="cf=0;setp('claim/d${d}/${who}',Date.now())">Yes, I did it ✅</button><button class="b d" onclick="cf=0;render()">Not yet</button></div></div>`:`<button class="b ${who=='asser'?'gr':''}" onclick="cf=1;render()">I did it! ✋</button>`;h+='<p style="text-align:center"><small class=c id=cd></small></p>'}
  h+=board();
 }else h+=adm(d,T,cur,cl,w);
 h+=`<p style="text-align:center"><small class=c style="cursor:pointer" onclick="confirm('Change player on this phone?')&&(localStorage.who=who='',render())">change player</small></p>`;
 A.innerHTML=h;cd()}
const board=()=>`<div class=sb>${['lilly','asser'].map(p=>`<div style="border-color:${PC[p]}">${cap(p)}<big style="color:${PC[p]}">${sc(p)}</big></div>`).join('')}</div>`;
function adm(d,T,cur,cl,w){
 let h=`<div class=tabs>${[['today','📅 Today'],['score','🏆 Scores'],['chal','📜 List'],['set','⚙️ Settings']].map(([k,l])=>`<button class="tab${tab==k?' on':''}" onclick="setTab('${k}')">${l}</button>`).join('')}</div>`;
 if(tab=='today'){
  h+=`<div class=nav><button class="b d" onclick="go(-1)">◀</button><select onchange="zd=+this.value;render()">${Array.from({length:T},(_,i)=>`<option value=${i+1} ${i+1==d?'selected':''}>Day ${i+1}${i+1==cur?' (today)':''}</option>`).join('')}</select><button class="b d" onclick="go(1)">▶</button></div>`;
  let used=new Set(),pk=(S.pick||{})['d'+d]!=null;for(let k=1;k<=T;k++){if(k!=d&&(k<cur||(S.pick||{})['d'+k]!=null))used.add(ci(k))}
  h+=`<div class=panel><b>🎯 Challenge for Day ${d}</b><select onchange="setp('pick/d${d}',+this.value)">${S.ch.map((c,i)=>`<option value=${i} ${i==ci(d)?'selected':''}>${used.has(i)?'✔ ':''}${i+1}. ${esc(c.split('|')[0])} (${lv(i+1)[0]})</option>`).join('')}</select><small class=c>${pk?'You picked this one. ✔ = already used on another day.':'Not picked yet, so it follows the list order. ✔ = already used.'}</small>${pk?`<br><button class="b s d" onclick="setp('pick/d${d}',null)">Back to list order</button>`:''}</div>`;
  h+=`<div class=panel><b>Who says they did it?</b>${['lilly','asser'].map(p=>`<div class=row style="border-color:${cl[p]?PC[p]:''}"><span style="color:${PC[p]}">${cap(p)}</span><span>${cl[p]?'✋ '+new Date(cl[p]).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}):'waiting…'}</span></div>`).join('')}</div>
  <div class=panel><b>Winner: ${w?(w=='none'?'No winner':cap(w)):'not picked yet'}</b>

 if(tab=='score'){

 }
 if(tab=='chal'){

   return `<div class=row><span class=n><span class=lvd style="background:${col}"></span>${i+1}. ${esc(a)}${i==ci(cur)?' <small class=c>(today)</small>':''}</span><button class="b s d" onclick="mv(${i},-1)">▲</button><button class="b s d" onclick="mv(${i},1)">▼</button><button class="b s d" onclick="ei=${ei==i?-1:i};render()">✎</button><button class="b s d" onclick="del(${i})">🗑</button></div>`+
   (ei==i?`<div class=panel><input id=et value="${esc(a)}" placeholder="Title"><textarea id=ed rows=3 placeholder="What to do">${esc(c.split('|').slice(1).join('|'))}</textarea><button class="b s gr" onclick="sv(${i})">Save</button><button class="b s d" onclick="ei=-1;render()">Cancel</button></div>`:'')}).join('');

 }

  <button class="b d" onclick="resetS()">Reset season</button>${DB?'':'<p style="color:#ff8a95">Sync is OFF: add your Firebase URL in index.html (DB constant).</p>'}`;
 }
 return h+board()}
