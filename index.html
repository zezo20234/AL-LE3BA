<style>

.rays{transform-box:fill-box;transform-origin:center;animation:spin 24s linear infinite}

.sp:nth-child(2n){background:#4be68a}

@keyframes pop{from{transform:scale(0);opacity:0}}
#fx.fw .sub{color:#d6ffe3}

#fx.fl{background:radial-gradient(circle at 50% 30%,#3a0d12 0,#14070a 52%,#000 100%);animation:fxin .3s both,shake .8s .05s}
@keyframes shake{0%,100%{transform:none}10%{transform:translate(-14px,6px)}20%{transform:translate(12px,-8px)}30%{transform:translate(-12px,-4px)}40%{transform:translate(10px,8px)}50%{transform:translate(-8px,2px)}60%{transform:translate(6px,-4px)}80%{transform:translate(-3px,2px)}}

@keyframes rf{from{opacity:.75}to{opacity:0}}
#fx .sad{font-size:120px;line-height:1;filter:grayscale(.5) drop-shadow(0 0 18px #ff475755);animation:sadin 1.1s both,wob 2.6s 1.2s ease-in-out infinite}
@keyframes sadin{0%{transform:translateY(-80vh) rotate(-25deg)}50%{transform:translateY(0) rotate(0)}65%{transform:translateY(-34px)}80%{transform:translateY(0)}90%{transform:translateY(-9px)}100%{transform:none}}

#fx .lt2{font-size:44px;font-weight:bold;letter-spacing:3px;margin:10px 0 4px;color:#a3a6ad;text-shadow:0 0 16px #ff475788;transform-origin:50% 0;animation:melt 1.3s .7s cubic-bezier(.3,1.2,.5,1) both}
@keyframes melt{from{opacity:0;transform:scaleY(.1) translateY(-40px);letter-spacing:22px}60%{transform:scaleY(1.25)}}
#fx.fl .sub{color:#e6b5ba}
#fx .rain{position:absolute;top:-50px;z-index:1;font-style:normal;opacity:.85;animation:fallr linear infinite}
@keyframes fallr{to{transform:translateY(115vh) rotate(var(--rt))}}
@media (prefers-reduced-motion:reduce){#fx .rr,#fx .tr,#fx .sad,#fx.fl{animation:none}#bn .bell{animation:none}}

<script>
// Firebase Realtime Database (live sync between all phones)
const FB={apiKey:"AIzaSyAfm1SkQSqwpf-82kWrsTgoiXgk2DMOSpU",authDomain:"retrocallapp.firebaseapp.com",databaseURL:"https://retrocallapp-default-rtdb.firebaseio.com",projectId:"retrocallapp",storageBucket:"retrocallapp.firebasestorage.app",messagingSenderId:"364436629934",appId:"1:364436629934:web:080df2aa03fad1f6fcc03f"};
const CV=2; // challenge list version: bump to push a new default list to every phone
const C=[
// EASY (days 1-10)
"Bed Boss|Make your bed neatly AND clear your desk in 5 minutes. Zezo inspects it.",
"Tongue Twister|Say 'She sells seashells by the seashore' 5 times fast with no mistakes.",
"Jumping Jacks|Do 25 jumping jacks without stopping.",
"Pharaoh Artist|Draw a pharaoh mask in 5 minutes. Make it colourful!",
"Kindness Quest|Do 2 kind things for your family today and tell Zezo what they were.",
"Flamingo Stand|Stand on one leg with your arms out: 30 seconds on each leg, no wobbling.",
"Water Warrior|Drink 4 cups of water today. Zezo counts.",
"Golden Story|Tell a 1-minute made-up story about a golden eye that must include a dragon.",
"Sock Basket|Stand 2 big steps away and toss rolled socks into a basket: score 5 out of 10.",
"Funny Reader|Read 2 pages out loud, using a different silly voice on every paragraph.",
// MEDIUM (days 11-20)
"Memory Cards|Look at 10 objects for 20 seconds, then name at least 9 of them.",
"Plank Time|Hold a plank for 45 seconds.",
"Riddle Duel|Solve 3 riddles from Zezo. One wrong answer and you fail.",
"Secret Code|Invent your own secret alphabet, write your name in it and teach Zezo to read it.",
"Silent Ninja|Stay completely silent for 2 minutes while Zezo tries to make you laugh.",
"Cup Pyramid|Build a 6-cup pyramid in under 90 seconds.",
"Math Sprint|Answer 12 math questions in 2 minutes.",
"Blind Find|Blindfolded, find 3 objects Zezo names in under 90 seconds.",
"Spelling Bee|Spell 10 words picked by Zezo, no mistakes allowed.",
"Chef Helper|Help an adult cook: set the table AND clear up after the meal.",
// HARD (days 21-30)
"Staring Contest|Beat Zezo in a no-blinking, no-smiling staring contest.",

"Plank Boss|Hold a plank for 1 minute 15 seconds.",
"Code Breaker|Crack a 5-letter cipher that Zezo prepares, in under 5 minutes.",
"Speed Clean|Clean your whole room in 10 minutes and pass Zezo's inspection.",
"Twister Pro|Say 3 hard tongue twisters in a row with no mistakes.",
"Book Report|Tell Zezo the plot of a book in 2 minutes, then answer 2 questions about it.",
"Puzzle Run|Finish a 30-piece puzzle in under 10 minutes.",
"Mind Maze|Draw a maze that takes Zezo more than 1 minute to solve.",
"The Grand Finale|Three in a row with no break: 20 squats, one riddle, then a 30-second one-leg balance."
];
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),cap=s=>s[0].toUpperCase()+s.slice(1);
const td=()=>{let d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const PC={lilly:'#ff5a67',asser:'#2ecc71'};
let S=JSON.parse(localStorage.S||'null')||{start:td(),ch:[...C],cv:CV,win:{},claim:{},custom:{},bonus:{lilly:0,asser:0},pin:"1234"};
let who=localStorage.who||'',zd=0,ok=0,cf=0,busy=0,tab=localStorage.tab||'today',ei=-1,db=null,SV=null,off=0,sup='';
const save=()=>localStorage.S=JSON.stringify(S);
const rr=()=>{if(!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName))render()};
function setp(p,v){let o=S,k=p.split('/');k.slice(0,-1).forEach(x=>o=o[x]=o[x]||{});v===null?delete o[k.at(-1)]:o[k.at(-1)]=v;save();if(db)db.ref(p).set(v).catch(()=>{});render()}
function mig(){if((S.cv||0)>=CV)return;S.ch=[...C];S.cv=CV;save();if(db){db.ref('ch').set(S.ch);db.ref('cv').set(CV)}}
function startSync(){
 if(!window.firebase)return dot();
 try{
  firebase.initializeApp(FB);db=firebase.database();SV=firebase.database.ServerValue;
  db.ref('.info/serverTimeOffset').on('value',s=>off=s.val()||0);
  db.ref('.info/connected').on('value',s=>{ok=s.val()?1:0;dot();rr()});
  db.ref('/').on('value',s=>{let d=s.val();if(d)applyRemote(d);else db.ref('/').set(JSON.parse(JSON.stringify(S)))},()=>{ok=0;dot()});
 }catch(e){db=null}
}
function applyRemote(d){
 S={start:S.start,pin:S.pin,cv:S.cv,win:{},claim:{},custom:{},pick:{},...d};
 S.ch=Object.values(S.ch||C).filter(Boolean);S.bonus={lilly:0,asser:0,...(d.bonus||{})};
 mig();save();rr();
 if(d.evt)onEvt(d.evt);
 if(d.msg)onMsg(d.msg);
